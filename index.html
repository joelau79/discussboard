<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>討論區 | Discuss Forum</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --accent: #22d3ee;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .nav { display: flex; gap: 8px; }
        
        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: var(--text-secondary);
        }
        
        .nav-btn:hover { background: var(--border); color: var(--text-primary); }
        .nav-btn.active { background: var(--primary); color: white; }
        .login-btn { background: var(--primary) !important; color: white !important; }
        
        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 24px;
            text-align: center;
        }
        
        .hero h1 {
            font-size: 48px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .hero p { font-size: 18px; color: var(--text-secondary); margin-bottom: 32px; }
        
        .hero-stats { display: flex; justify-content: center; gap: 48px; margin-top: 40px; }
        .stat { text-align: center; }
        .stat-number { font-size: 36px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 14px; color: var(--text-secondary); }
        
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px 60px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
        }
        
        .sidebar { position: sticky; top: 100px; height: fit-content; }
        
        .sidebar-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        
        .sidebar-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        
        .category-list { list-style: none; }
        
        .category-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        
        .category-item:hover, .category-item.active { background: var(--border); }
        .category-item.active { background: var(--primary); }
        
        .category-name { font-size: 14px; }
        .category-count { font-size: 12px; color: var(--text-secondary); background: var(--bg-dark); padding: 2px 8px; border-radius: 10px; }
        
        .forum-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .forum-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .forum-title { font-size: 18px; font-weight: 600; }
        
        .new-post-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .new-post-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
        
        .post-list { list-style: none; }
        
        .post-item {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .post-item:last-child { border-bottom: none; }
        .post-item:hover { background: rgba(99, 102, 241, 0.05); }
        
        .post-title { font-size: 16px; font-weight: 500; margin-bottom: 8px; }
        
        .post-meta { display: flex; gap: 16px; font-size: 13px; color: var(--text-secondary); }
        .post-meta-item { display: flex; align-items: center; gap: 4px; }
        
        .post-tag {
            display: inline-block;
            padding: 2px 8px;
            background: var(--primary);
            color: white;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 8px;
        }
        
        .post-tag.hot { background: #ef4444; }
        .post-tag.new { background: #22c55e; }
        
        .footer {
            text-align: center;
            padding: 40px 24px;
            color: var(--text-secondary);
            font-size: 14px;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
        
        .footer a { color: var(--accent); text-decoration: none; }
        
        @media (max-width: 768px) {
            .main { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .hero h1 { font-size: 32px; }
            .hero-stats { gap: 24px; }
            .stat-number { font-size: 24px; }
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-overlay.active { display: flex; }
        
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            padding: 32px;
        }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-title { font-size: 20px; font-weight: 600; }
        .modal-close { background: none; border: none; color: var(--text-secondary); font-size: 24px; cursor: pointer; }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
        
        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }
        
        .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--primary); }
        .form-textarea { min-height: 120px; resize: vertical; }
        
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .submit-btn:hover { background: var(--primary-dark); }
        
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">💬</div>
                <span>討論區</span>
            </div>
            <nav class="nav">
                <button class="nav-btn active">首頁</button>
                <button class="nav-btn">最新</button>
                <button class="nav-btn">熱門</button>
                <button class="nav-btn login-btn" onclick="window.open('https://github.com/joelau79/discussboard/discussions', '_blank')">進入討論</button>
            </nav>
        </div>
    </header>
    
    <section class="hero">
        <h1>一個香港，只得一個討論區</h1>
        <p>正正經經，嚟度傾</p>
        <div class="hero-stats">
            <div class="stat">
                <div class="stat-number" id="topics-count">-</div>
                <div class="stat-label">主題</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="posts-count">-</div>
                <div class="stat-label">帖子</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="members-count">1</div>
                <div class="stat-label">會員</div>
            </div>
        </div>
    </section>
    
    <main class="main">
        <aside class="sidebar">
            <div class="sidebar-card">
                <div class="sidebar-title">討論版塊</div>
                <ul class="category-list">
                    <li class="category-item active" onclick="filterCategory('all')">
                        <span class="category-name">全部</span>
                        <span class="category-count" id="cat-all">0</span>
                    </li>
                    <li class="category-item" onclick="filterCategory('announcements')">
                        <span class="category-name">📢 公告</span>
                        <span class="category-count" id="cat-announcements">0</span>
                    </li>
                    <li class="category-item" onclick="filterCategory('general')">
                        <span class="category-name">💬 一般</span>
                        <span class="category-count" id="cat-general">0</span>
                    </li>
                    <li class="category-item" onclick="filterCategory('ideas')">
                        <span class="category-name">💡 建議</span>
                        <span class="category-count" id="cat-ideas">0</span>
                    </li>
                    <li class="category-item" onclick="filterCategory('q-a')">
                        <span class="category-name">❓ 問答</span>
                        <span class="category-count" id="cat-q-a">0</span>
                    </li>
                </ul>
            </div>
            
            <div class="sidebar-card">
                <div class="sidebar-title">系統資訊</div>
                <div style="font-size: 13px; color: var(--text-secondary);">
                    <p>Powered by GitHub Discussions</p>
                    <p style="margin-top: 8px;">輕量、免費、开源</p>
                </div>
            </div>
        </aside>
        
        <section class="forum-content">
            <div class="forum-header">
                <h2 class="forum-title">📋 最新帖子</h2>
                <button class="new-post-btn" onclick="window.open('https://github.com/joelau79/discussboard/discussions/new', '_blank')">
                    <span>+</span> 發表新帖
                </button>
            </div>
            <ul class="post-list" id="post-list">
                <li class="loading">載入中...</li>
            </ul>
        </section>
    </main>
    
    <footer class="footer">
        <p>討論區 © 2026 | 使用 <a href="https://giscus.app" target="_blank">Giscus</a> 驅動 | 基於 GitHub Discussions</p>
    </footer>
    
    <script>
        const REPO_OWNER = "joelau79";
        const REPO_NAME = "discussboard";
        const CATEGORY_IDS = {
            "announcements": "DIC_kwDOSSUt2M4C8g5A",
            "general": "DIC_kwDOSSUt2M4C8g5B",
            "ideas": "DIC_kwDOSSUt2M4C8g5D",
            "q-a": "DIC_kwDOSSUt2M4C8g5C"
        };
        
        let allDiscussions = [];
        
        async function loadDiscussions() {
            const postList = document.getElementById('post-list');
            
            try {
                // Fetch discussions from GitHub GraphQL API (public, no auth needed)
                const query = `
                    query {
                        repository(owner: "${REPO_OWNER}", name: "${REPO_NAME}") {
                            discussions(first: 30, orderBy: {field: CREATED_AT, direction: DESC}) {
                                nodes {
                                    title
                                    url
                                    createdAt
                                    category { name slug }
                                    comments { totalCount }
                                }
                            }
                        }
                    }
                `;
                
                const response = await fetch('https://api.github.com/graphql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                
                const data = await response.json();
                const discussions = data?.data?.repository?.discussions?.nodes || [];
                
                allDiscussions = discussions;
                displayDiscussions(discussions);
                updateStats(discussions);
                
            } catch (error) {
                console.error('Error loading discussions:', error);
                postList.innerHTML = '<li class="loading">載入失敗，請刷新重試</li>';
            }
        }
        
        function displayDiscussions(discussions) {
            const postList = document.getElementById('post-list');
            
            if (discussions.length === 0) {
                postList.innerHTML = '<li class="loading">暫無帖子，成為第一個發帖的人！</li>';
                return;
            }
            
            postList.innerHTML = discussions.map(disc => `
                <li class="post-item" onclick="window.open('${disc.url}', '_blank')">
                    <div class="post-title">
                        ${getCategoryTag(disc.category.slug)} ${disc.title}
                    </div>
                    <div class="post-meta">
                        <span class="post-meta-item">📁 ${disc.category.name}</span>
                        <span class="post-meta-item">💬 ${disc.comments.totalCount} 回復</span>
                        <span class="post-meta-item">🕐 ${formatDate(disc.createdAt)}</span>
                    </div>
                </li>
            `).join('');
        }
        
        function getCategoryTag(slug) {
            const tags = {
                'announcements': '<span class="post-tag" style="background:#ef4444;">公告</span>',
                'general': '<span class="post-tag new">新</span>',
                'ideas': '<span class="post-tag" style="background:#f59e0b;">建議</span>',
                'q-a': '<span class="post-tag" style="background:#10b981;">問答</span>'
            };
            return tags[slug] || '';
        }
        
        function updateStats(discussions) {
            const count = discussions.length;
            document.getElementById('topics-count').textContent = count;
            document.getElementById('posts-count').textContent = 
                discussions.reduce((sum, d) => sum + d.comments.totalCount, 0);
            
            // Update category counts
            const cats = {};
            discussions.forEach(d => {
                cats[d.category.slug] = (cats[d.category.slug] || 0) + 1;
            });
            
            for (const [slug, cnt] of Object.entries(cats)) {
                const el = document.getElementById(`cat-${slug}`);
                if (el) el.textContent = cnt;
            }
        }
        
        function filterCategory(category) {
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.category-item').classList.add('active');
            
            if (category === 'all') {
                displayDiscussions(allDiscussions);
            } else {
                const filtered = allDiscussions.filter(d => d.category.slug === category);
                displayDiscussions(filtered);
            }
        }
        
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 60) return diffMins + '分鐘前';
            if (diffHours < 24) return diffHours + '小時前';
            if (diffDays < 30) return diffDays + '天前';
            return date.toLocaleDateString('zh-HK');
        }
        
        // Initialize
        loadDiscussions();
    </script>
    
    <!-- Giscus - Comments widget -->
    <script
        src="https://giscus.app/client.js"
        data-repo="joelau79/discussboard"
        data-repo-id="R_kgDOSSUt2A"
        data-category="General"
        data-category-id="DIC_kwDOSSUt2M4C8g5B"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="dark_dimmed"
        data-lang="zh-TW"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
    </script>
</body>
</html>
